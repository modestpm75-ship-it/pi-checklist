<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>S-House PI 체크리스트</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:#f1f5f9}
.hide{display:none!important}

/* 로그인 */
.login{position:fixed;inset:0;background:linear-gradient(135deg,#1e3a5f,#3b82f6);display:flex;justify-content:center;align-items:center}
.login-box{background:#fff;padding:40px;border-radius:16px;width:90%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.login-box h1{text-align:center;color:#1e3a5f;margin-bottom:8px;font-size:1.5rem}
.login-box p{text-align:center;color:#64748b;margin-bottom:24px}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-weight:600;color:#374151;margin-bottom:6px}
.form-group input,.form-group select{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:8px;font-size:1rem}
.btn{width:100%;padding:14px;border:none;border-radius:8px;font-size:1rem;font-weight:600;cursor:pointer;margin-top:8px}
.btn-blue{background:#3b82f6;color:#fff}.btn-blue:hover{background:#2563eb}
.btn-green{background:#22c55e;color:#fff}.btn-green:hover{background:#16a34a}
.btn-red{background:#ef4444;color:#fff}.btn-red:hover{background:#dc2626}
.btn-gray{background:#e5e7eb;color:#374151}.btn-gray:hover{background:#d1d5db}
.login-info{background:#eff6ff;padding:12px;border-radius:8px;margin-top:20px;font-size:.85rem;color:#1e40af;text-align:center}
.error{color:#ef4444;font-size:.9rem;margin-top:8px;text-align:center}

/* 헤더 */
.header{background:linear-gradient(135deg,#1e3a5f,#3b82f6);color:#fff;padding:16px 20px;position:sticky;top:0;z-index:100}
.header-top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.header h1{font-size:1.2rem}
.header-btns{display:flex;gap:8px;flex-wrap:wrap}
.header-btns button{padding:8px 14px;border:none;border-radius:6px;font-size:.85rem;font-weight:600;cursor:pointer;background:rgba(255,255,255,.2);color:#fff}
.header-btns button:hover{background:rgba(255,255,255,.3)}
.header-btns button.active{background:#fff;color:#1e3a5f}
.user-info{display:flex;align-items:center;gap:12px;margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.2)}
.progress-bar{width:120px;height:6px;background:rgba(255,255,255,.3);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:#4ade80;transition:width .3s}

/* 메인 */
.main{max-width:1000px;margin:0 auto;padding:20px}

/* 홈 카드 */
.home-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}
.part-card{background:#fff;border-radius:16px;padding:24px;cursor:pointer;transition:all .2s;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.part-card:hover{transform:translateY(-4px);box-shadow:0 8px 24px rgba(0,0,0,.12)}
.part-card h2{font-size:1.3rem;margin-bottom:8px}
.part-card p{color:#64748b;margin-bottom:16px}
.part-card .count{font-size:2rem;font-weight:700;color:#3b82f6}

/* 영역 목록 */
.back-btn{display:inline-flex;align-items:center;gap:6px;padding:10px 16px;background:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.area-card{background:#fff;border-radius:12px;padding:16px;margin-bottom:12px;cursor:pointer;display:flex;align-items:center;gap:16px;box-shadow:0 1px 3px rgba(0,0,0,.08);transition:all .2s}
.area-card:hover{box-shadow:0 4px 12px rgba(0,0,0,.12)}
.area-icon{width:50px;height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.5rem}
.area-info{flex:1}
.area-info h3{font-size:1rem;margin-bottom:4px}
.area-info p{color:#64748b;font-size:.85rem}
.area-stats{text-align:right}
.area-stats .score{font-size:1.5rem;font-weight:700}
.area-stats .count{font-size:.85rem;color:#64748b}
.area-bar{width:80px;height:6px;background:#e5e7eb;border-radius:3px;overflow:hidden;margin-top:6px}
.area-bar-fill{height:100%;border-radius:3px}

/* 체크리스트 */
.section-header{background:#fff;padding:16px;border-radius:12px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
.item-card{background:#fff;border-radius:12px;margin-bottom:10px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08);border-left:4px solid #e5e7eb}
.item-card.s1{border-left-color:#ef4444}.item-card.s2{border-left-color:#f97316}.item-card.s3{border-left-color:#eab308}.item-card.s4{border-left-color:#84cc16}.item-card.s5{border-left-color:#22c55e}
.item-header{padding:14px 16px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.item-header:hover{background:#f8fafc}
.item-no{background:#e5e7eb;padding:4px 10px;border-radius:4px;font-weight:600;font-size:.85rem;margin-right:10px}
.item-title{font-weight:600;flex:1}
.item-sub{color:#64748b;font-size:.8rem;margin-left:8px}
.badge{padding:6px 12px;border-radius:20px;font-size:.85rem;font-weight:600}
.badge.empty{background:#f3f4f6;color:#9ca3af}
.badge.filled{background:#22c55e;color:#fff}
.item-body{display:none;padding:16px;background:#f8fafc;border-top:1px solid #e5e7eb}
.item-card.open .item-body{display:block}
.detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin-bottom:16px}
.detail-box{background:#fff;padding:12px;border-radius:8px;border:1px solid #e5e7eb}
.detail-box h4{font-size:.8rem;color:#64748b;margin-bottom:6px}
.detail-box p{font-size:.85rem;line-height:1.6;white-space:pre-line}
.detail-box.crit{background:#fefce8;border-color:#fcd34d}
.bench-row{display:flex;gap:12px;margin-bottom:16px}
.bench-box{flex:1;padding:12px;border-radius:8px;text-align:center}
.bench-box.top{background:#f0fdf4;border:1px solid #22c55e}
.bench-box.avg{background:#fff7ed;border:1px solid #f97316}
.bench-label{font-size:.75rem;color:#64748b}
.bench-value{font-weight:700;font-size:1rem}
.score-section{background:#fff;padding:16px;border-radius:8px;border:2px solid #e5e7eb}
.score-section h4{margin-bottom:12px}
.score-btns{display:flex;gap:8px;margin-bottom:12px}
.score-btn{width:50px;height:50px;border:2px solid #d1d5db;border-radius:10px;background:#fff;font-size:1.3rem;font-weight:700;cursor:pointer}
.score-btn:hover{border-color:#3b82f6}
.score-btn.sel{color:#fff}
.score-btn.s1.sel{background:#ef4444;border-color:#ef4444}
.score-btn.s2.sel{background:#f97316;border-color:#f97316}
.score-btn.s3.sel{background:#eab308;border-color:#eab308}
.score-btn.s4.sel{background:#84cc16;border-color:#84cc16}
.score-btn.s5.sel{background:#22c55e;border-color:#22c55e}
.memo{width:100%;padding:10px;border:1px solid #d1d5db;border-radius:6px;resize:vertical;min-height:50px}

/* 대시보드 */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;margin-bottom:24px}
.stat-card{background:#fff;border-radius:12px;padding:20px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.stat-value{font-size:2.2rem;font-weight:700}
.stat-value.blue{color:#3b82f6}.stat-value.green{color:#22c55e}.stat-value.orange{color:#f97316}
.stat-label{color:#64748b;font-size:.85rem;margin-top:4px}
.chart-card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.chart-title{font-weight:600;margin-bottom:16px}
.bar-row{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.bar-label{width:140px;font-size:.85rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-wrap{flex:1;height:20px;background:#e5e7eb;border-radius:4px;overflow:hidden}
.bar-fill{height:100%;display:flex;align-items:center;justify-content:flex-end;padding-right:6px;font-size:.75rem;font-weight:600;color:#fff;border-radius:4px}
.bar-count{width:60px;text-align:right;font-size:.85rem;color:#64748b}

/* 관리자 */
.admin-card{background:#fff;border-radius:12px;padding:20px;margin-bottom:20px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.admin-card h3{margin-bottom:16px;font-size:1rem}
.form-row{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.form-row input{flex:1;min-width:150px;padding:10px;border:1px solid #d1d5db;border-radius:6px}
.form-row button{padding:10px 20px}
.eval-list{max-height:300px;overflow-y:auto}
.eval-item{display:flex;justify-content:space-between;align-items:center;padding:12px;background:#f8fafc;border-radius:8px;margin-bottom:8px}
.eval-name{font-weight:600}
.eval-info{color:#64748b;font-size:.85rem}

@media(max-width:768px){
.header-top{flex-direction:column;align-items:flex-start}
.main{padding:12px}
.home-grid{grid-template-columns:1fr}
.detail-grid{grid-template-columns:1fr}
.bench-row{flex-direction:column}
.score-btn{width:44px;height:44px}
.bar-label{width:100px}
}
</style>
</head>
<body>

<!-- 로그인 -->
<div class="login" id="loginPage">
<div class="login-box">
<h1>🏭 S-House PI 체크리스트</h1>
<p>Process Improvement 진단 평가</p>
<div class="form-group"><label>평가자 선택</label><select id="selUser"><option value="">-- 선택 --</option></select></div>
<div class="form-group"><label>비밀번호</label><input type="password" id="inpPw" placeholder="비밀번호"></div>
<button class="btn btn-blue" onclick="doLogin()">로그인</button>
<div class="error hide" id="loginErr"></div>
<div class="login-info">Part 1: 107개 | Part 2: 115개 | 총 222개 항목<br>관리자 기본 비밀번호: admin123</div>
</div>
</div>

<!-- 앱 -->
<div class="hide" id="app">
<div class="header">
<div class="header-top">
<h1>🏭 S-House PI 체크리스트</h1>
<div class="header-btns">
<button id="btnHome" onclick="goHome()">🏠 홈</button>
<button id="btnDash" onclick="goDash()">📊 현황</button>
<button id="btnAdmin" onclick="goAdmin()">⚙️ 관리</button>
<button onclick="logout()">🚪 로그아웃</button>
</div>
</div>
<div class="user-info">
<span id="userName"></span>
<span id="progText">0/222</span>
<div class="progress-bar"><div class="progress-fill" id="progBar"></div></div>
</div>
</div>
<div class="main" id="mainContent"></div>
</div>

<script>
const AREAS=[{part:1,code:"MAN",name:"Man (인적요인)",emoji:"👤",color:"#dc2626",count:20},
{part:1,code:"MAT",name:"Material (자재/원료)",emoji:"📦",color:"#059669",count:22},
{part:1,code:"MAC",name:"Machine (설비)",emoji:"⚙️",color:"#2563eb",count:20},
{part:1,code:"MTD",name:"Method (방법/프로세스)",emoji:"📋",color:"#7c3aed",count:17},
{part:1,code:"HRM",name:"HR (인적자원관리)",emoji:"👥",color:"#0891b2",count:14},
{part:1,code:"TTR",name:"Tech Transfer (기술이전)",emoji:"🔬",color:"#ea580c",count:14},
{part:2,code:"CST",name:"Cost (원가관리)",emoji:"💰",color:"#ca8a04",count:20},
{part:2,code:"FIN",name:"Finance (재무회계)",emoji:"📊",color:"#16a34a",count:16},
{part:2,code:"SHE",name:"SHE (안전보건환경)",emoji:"🛡️",color:"#dc2626",count:18},
{part:2,code:"GMP",name:"GMP (제조품질관리)",emoji:"✅",color:"#2563eb",count:21},
{part:2,code:"CMP",name:"Compliance (규제준수)",emoji:"📜",color:"#c2410c",count:16},
{part:2,code:"SCM",name:"Supply Chain (공급망)",emoji:"🚚",color:"#0d9488",count:8},
{part:2,code:"DIG",name:"IT/Digital (디지털전환)",emoji:"💻",color:"#7c3aed",count:8},
{part:2,code:"ENV",name:"Energy/Env (에너지환경)",emoji:"🌱",color:"#16a34a",count:8}];
const ITEMS=[{id:"MAN_1",part:1,area:"MAN",no:1,sub:"SOP 준수",title:"SOP 미준수 Deviation",q:"최근 12개월간 SOP 미준수로 인한 Deviation 발생 건수를 집계하라. 동일 SOP에 대한 반복 미준수가 있는가? 미준수 발생 시 Root Cause 분석이 7일 이내 완료되는가?",ref:"ICH Q10 §3.2.1 CAPA System\n21 CFR 211.22 QC Responsibilities\nKGMP §24 제조관리\nEU GMP Ch.1.4(viii) Deviation",crit:"【5점】0건/년\n【4점】1-2건/년\n【3점】3-5건/년\n【2점】6-10건/년\n【1점】11건 이상/년",meas:"QMS에서 Deviation 유형별 조회\n→ \"SOP 미준수\" 태그 건수 집계",top:"0건/년",avg:"3-5건/년"},
{id:"MAN_2",part:1,area:"MAN",no:2,sub:"SOP 준수",title:"Critical Step 이중확인",q:"Batch Record의 Critical Step(칭량, 투입, 주요 공정 파라미터)에 대해 제2자 확인(Double Check)이 100% 수행되는지 확인하라. 확인자 자격요건(동일 공정 6개월 이상 경력 등)이 SOP에 명시되어 있는가?",ref:"EU GMP Annex 15 §5.25\nPIC/S PE 009-16 §5.43\n21 CFR 211.101(d) Charge-in",crit:"【5점】100% 수행 + 자격요건 문서화\n【4점】100% 수행, 자격요건 미흡\n【3점】95-99% 수행\n【2점】90-94% 수행\n【1점】90% 미만",meas:"Batch Record 샘플링 검토(월 10건)\n→ Critical Step 확인란 기입률",top:"100%",avg:"95%"},
{id:"MAN_3",part:1,area:"MAN",no:3,sub:"SOP 준수",title:"동시기록(ALCOA) 준수",q:"Batch Record 기록이 작업과 동시에(Contemporaneous) 이루어지는가? 무작위 감사 시 사후기록/선기록 적발 건수는? 기록 시간과 공정 Log 시간 차이가 30분 이내인가?",ref:"FDA Data Integrity Guidance 2018\nMHRA GxP DI Guidance §6.12\nPIC/S PI 041-1 §5.4\nWHO TRS 996 Annex 5",crit:"【5점】사후/선기록 0건, 시간차 <15분\n【4점】0건, 시간차 <30분\n【3점】1-2건/년, 시간차 <30분\n【2점】3-5건/년\n【1점】6건 이상/년",meas:"월 1회 무작위 감사(5 Batch)\n→ MES Log vs 기록시간 비교",top:"0건",avg:"2건/년"},
{id:"MAN_4",part:1,area:"MAN",no:4,sub:"SOP 준수",title:"기록 정정 절차 준수",q:"기록 오류 정정 시 ①Single line cross-out ②날짜 ③서명 ④정정사유 4가지가 모두 기재되는가? White-out, 덮어쓰기, 수정테이프 사용이 0건인가?",ref:"EU GMP Annex 11 §9\n21 CFR 211.194(a)\nWHO TRS 996 Annex 5 §15.5",crit:"【5점】부적절 정정 0건/년\n【4점】1건/년\n【3점】2-3건/년\n【2점】4-5건/년\n【1점】6건 이상/년",meas:"QA Batch Review 시 정정 건 전수 검토\n→ 부적절 정정 건수 집계",top:"0건",avg:"2건/년"},
{id:"MAN_5",part:1,area:"MAN",no:5,sub:"숙련도 관리",title:"Skill Matrix 구축률",q:"전 생산/포장 공정에 대한 Skill Matrix가 구축되어 있는가? Level 정의(1-독립불가 ~ 4-교육가능)가 명확하고, 분기 1회 이상 업데이트 되는가?",ref:"ICH Q10 §2.7 Knowledge Mgmt\nISO 22716:2007 §3.3\nEU GMP Ch.2 Personnel",crit:"【5점】100% 구축 + 분기 Update\n【4점】100% 구축 + 반기 Update\n【3점】80-99% 구축\n【2점】60-79% 구축\n【1점】60% 미만",meas:"공정 목록 대비 Skill Matrix 존재 여부\n÷ 전체 공정 수 × 100",top:"100%",avg:"80%"},
{id:"MAN_6",part:1,area:"MAN",no:6,sub:"숙련도 관리",title:"작업자 자격인증 제도",q:"핵심공정(칭량/조제/타정/코팅/포장) 작업자에 대한 자격인증(Qualification) 제도가 운영되는가? ①이론시험(80점↑) ②실기평가 ③현장관찰 3단계 인증이 있는가? 연 1회 재인증이 수행되는가?",ref:"21 CFR 211.25 Personnel Qual.\nEU GMP Ch.2.10-2.12\nKGMP §9 교육훈련",crit:"【5점】3단계 인증 + 연1회 재인증\n【4점】2단계 인증 + 재인증\n【3점】1단계 인증만\n【2점】OJT만 운영\n【1점】제도 없음",meas:"인증 제도 문서 확인\n+ 인증 기록 샘플링 검토",top:"3단계+재인증",avg:"OJT만"},
{id:"MAN_7",part:1,area:"MAN",no:7,sub:"숙련도 관리",title:"작업자별 수율 편차",q:"동일 제품, 동일 공정에서 작업자별 수율(Yield) 편차를 측정하는가? 편차가 ±2% 초과 시 원인분석 및 추가교육이 진행되는가?",ref:"ICH Q10 §3.1 Process Monitoring\n21 CFR 211.188(b)(3)\nEU GMP Annex 15 §5.28 CPV",crit:"【5점】편차 ±1.5% 이내, 초과시 조치\n【4점】편차 ±2.0% 이내\n【3점】편차 ±3.0% 이내\n【2점】측정만, 조치 미흡\n【1점】측정 안함",meas:"MES/ERP에서 작업자별 수율 추출\n→ 표준편차 계산",top:"±1.5%",avg:"±3.0%"},
{id:"MAN_8",part:1,area:"MAN",no:8,sub:"숙련도 관리",title:"Multi-skill 인력 비율",q:"핵심공정에서 2개 이상 공정 수행 가능한 Multi-skilled 인력 비율은? 각 핵심공정별 최소 3인 이상 자격자가 확보되어 있는가?",ref:"ICH Q10 §4 Continual Improvement\nISO 22301:2019 BCP\nLean Multi-skilling",crit:"【5점】≥50% + 공정당 3인↑\n【4점】40-49% + 공정당 2인↑\n【3점】30-39%\n【2점】20-29%\n【1점】20% 미만",meas:"Skill Matrix에서 Level 3↑ 복수공정 보유자\n÷ 전체 작업자 × 100",top:"≥50%",avg:"30%"},
{id:"MAN_9",part:1,area:"MAN",no:9,sub:"칭량 관리",title:"칭량 오류 발생률",q:"칭량 공정에서 Human Error(원료 오인, 수량 오류, 용기 혼동, Lot 오류) 발생 건수는? Barcode/RFID 검증 시스템이 도입되어 있는가?",ref:"EU GMP Annex 8 Sampling\n21 CFR 211.68 Equipment\nPIC/S PE 009-16 §5.30-5.33",crit:"【5점】0건/년 + 자동검증 100%\n【4점】0건/년 + 자동검증 50%↑\n【3점】1-2건/년\n【2점】3-5건/년\n【1점】6건 이상/년",meas:"Deviation DB에서 \"칭량\" 키워드 검색\n+ Barcode 시스템 적용 범위 확인",top:"0건+자동검증",avg:"2건/년"},

{id:"MAN_12",part:1,area:"MAN",no:12,sub:"인수인계",title:"교대 인수인계 표준화",q:"교대 시 표준화된 체크리스트(①설비상태 ②진행Batch ③이상징후 ④미결사항 ⑤안전사항)가 운영되고, 양 교대조 서명으로 기록되는가?",ref:"ICH Q10 §1.6 Communication\nISO 9001:2015 §7.4\n교대근무 안전관리지침(고용노동부)",crit:"【5점】5개 항목 + 양측 서명 + 전자기록\n【4점】5개 항목 + 양측 서명\n【3점】3-4개 항목\n【2점】1-2개 항목만\n【1점】체크리스트 없음",meas:"인수인계 기록 샘플링(월 20건)\n→ 항목 기입률 및 서명 확인",top:"5항목+서명",avg:"3항목"},

const STORAGE='shouse_pi_all';
let cfg={adminPw:'admin123',users:{}},user=null,view='home',selPart=0,selArea='';

document.addEventListener('DOMContentLoaded',init);

function init(){load();updUserList();document.getElementById('inpPw').onkeypress=e=>{if(e.key==='Enter')doLogin()}}
function load(){try{const s=localStorage.getItem(STORAGE);if(s)cfg=JSON.parse(s)}catch(e){}}
function save(){try{localStorage.setItem(STORAGE,JSON.stringify(cfg))}catch(e){}}
function updUserList(){const sel=document.getElementById('selUser');sel.innerHTML='<option value="">-- 선택 --</option>'+Object.keys(cfg.users).map(n=>`<option value="${n}">${n}</option>`).join('')}

function doLogin(){
const name=document.getElementById('selUser').value,pw=document.getElementById('inpPw').value,err=document.getElementById('loginErr');
if(!name){err.textContent='평가자를 선택하세요';err.classList.remove('hide');return}
if(!cfg.users[name]){err.textContent='등록되지 않은 평가자';err.classList.remove('hide');return}
if(cfg.users[name].pw!==pw){err.textContent='비밀번호 오류';err.classList.remove('hide');return}
user=name;err.classList.add('hide');
document.getElementById('loginPage').classList.add('hide');
document.getElementById('app').classList.remove('hide');
document.getElementById('userName').textContent=user+(cfg.users[user].admin?' (관리자)':'');
document.getElementById('btnAdmin').style.display=cfg.users[user].admin?'inline-block':'none';
goHome();
}

function logout(){user=null;document.getElementById('app').classList.add('hide');document.getElementById('loginPage').classList.remove('hide');document.getElementById('inpPw').value='';updUserList()}

function updProg(){const d=cfg.users[user]?.data||{};const done=ITEMS.filter(i=>d[i.id]?.sc>0).length;document.getElementById('progText').textContent=done+'/222';document.getElementById('progBar').style.width=(done/222*100)+'%'}
function updBtns(){document.getElementById('btnHome').className=view==='home'?'active':'';document.getElementById('btnDash').className=view==='dash'?'active':'';document.getElementById('btnAdmin').className=view==='admin'?'active':''}

function goHome(){view='home';selPart=0;selArea='';updBtns();render()}
function goDash(){view='dash';updBtns();render()}
function goAdmin(){view='admin';updBtns();render()}
function goPart(p){view='areas';selPart=p;updBtns();render()}
function goArea(code){view='list';selArea=code;updBtns();render()}
function goBack(){if(view==='list'){view='areas';selArea='';}else if(view==='areas'){view='home';selPart=0;}updBtns();render()}

function render(){
const m=document.getElementById('mainContent');
if(view==='home')m.innerHTML=renderHome();
else if(view==='areas')m.innerHTML=renderAreas();
else if(view==='list')m.innerHTML=renderList();
else if(view==='dash')m.innerHTML=renderDash();
else if(view==='admin')m.innerHTML=renderAdmin();
updProg();
}

function renderHome(){
const d=cfg.users[user]?.data||{};
const p1=ITEMS.filter(i=>i.part===1&&d[i.id]?.sc>0).length;
const p2=ITEMS.filter(i=>i.part===2&&d[i.id]?.sc>0).length;
return `<div class="home-grid">
<div class="part-card" onclick="goPart(1)"><h2>📦 Part 1</h2><p>운영관리 영역</p><div class="count">${p1}/107</div><p style="margin-top:8px;color:#64748b">Man, Material, Machine, Method, HR, Tech Transfer</p></div>
<div class="part-card" onclick="goPart(2)"><h2>📋 Part 2</h2><p>관리지원 영역</p><div class="count">${p2}/115</div><p style="margin-top:8px;color:#64748b">Cost, Finance, SHE, GMP, Compliance, Supply Chain, Digital, Energy</p></div>
</div>`;
}

function renderAreas(){
const d=cfg.users[user]?.data||{};
const areas=AREAS.filter(a=>a.part===selPart);
let h=`<button class="back-btn" onclick="goBack()">← 뒤로</button><h2 style="margin-bottom:16px">Part ${selPart} - ${selPart===1?'운영관리':'관리지원'}</h2>`;
areas.forEach(a=>{
const items=ITEMS.filter(i=>i.area===a.code);
const scores=items.map(i=>d[i.id]?.sc||0).filter(s=>s>0);
const done=scores.length,avg=scores.length?(scores.reduce((x,y)=>x+y,0)/scores.length).toFixed(1):'-';
const pct=done/items.length*100;
h+=`<div class="area-card" onclick="goArea('${a.code}')">
<div class="area-icon" style="background:${a.color}20;color:${a.color}">${a.emoji}</div>
<div class="area-info"><h3>${a.name}</h3><p>${a.count}개 항목</p></div>
<div class="area-stats"><div class="score" style="color:${a.color}">${avg}</div><div class="count">${done}/${a.count}</div>
<div class="area-bar"><div class="area-bar-fill" style="width:${pct}%;background:${a.color}"></div></div></div></div>`;
});
return h;
}

function renderList(){
const d=cfg.users[user]?.data||{};
const area=AREAS.find(a=>a.code===selArea);
const items=ITEMS.filter(i=>i.area===selArea).sort((a,b)=>a.no-b.no);
const done=items.filter(i=>d[i.id]?.sc>0).length;
let h=`<button class="back-btn" onclick="goBack()">← 뒤로</button>
<div class="section-header"><div><span style="font-size:1.5rem;margin-right:8px">${area.emoji}</span><strong>${area.name}</strong></div><span>${done}/${items.length} 완료</span></div>`;
items.forEach(i=>{
const sc=d[i.id]?.sc||0,memo=d[i.id]?.memo||'';
h+=`<div class="item-card ${sc>0?'s'+sc:''}" id="card-${i.id}">
<div class="item-header" onclick="toggleItem('${i.id}')">
<div><span class="item-no">${i.no}</span><span class="item-title">${i.title}</span><span class="item-sub">${i.sub}</span></div>
<span class="badge ${sc>0?'filled':'empty'}" id="badge-${i.id}">${sc>0?sc+'점':'미평가'}</span></div>
<div class="item-body">
<div class="detail-grid">
<div class="detail-box"><h4>📋 점검 질문</h4><p>${i.q}</p></div>
<div class="detail-box crit"><h4>📊 평가 기준</h4><p>${i.crit}</p></div>
<div class="detail-box"><h4>📖 관련 기준</h4><p>${i.ref}</p></div>
<div class="detail-box"><h4>📏 측정 방법</h4><p>${i.meas}</p></div>
</div>
<div class="bench-row">
<div class="bench-box top"><div class="bench-label">🏆 탑티어</div><div class="bench-value" style="color:#16a34a">${i.top}</div></div>
<div class="bench-box avg"><div class="bench-label">📊 업계평균</div><div class="bench-value" style="color:#ea580c">${i.avg}</div></div>
</div>
<div class="score-section"><h4>✏️ 점수 선택</h4>
<div class="score-btns">${[1,2,3,4,5].map(s=>`<button class="score-btn s${s} ${sc===s?'sel':''}" onclick="setScore('${i.id}',${s})">${s}</button>`).join('')}</div>
<textarea class="memo" id="memo-${i.id}" placeholder="메모" onchange="setMemo('${i.id}',this.value)">${memo}</textarea>
</div></div></div>`;
});
return h;
}

function renderDash(){
const d=cfg.users[user]?.data||{};
const scores=ITEMS.map(i=>d[i.id]?.sc||0).filter(s=>s>0);
const done=scores.length,avg=scores.length?(scores.reduce((a,b)=>a+b,0)/scores.length).toFixed(2):'-',low=scores.filter(s=>s<=2).length;
let bars='';
AREAS.forEach(a=>{
const items=ITEMS.filter(i=>i.area===a.code);
const sc=items.map(i=>d[i.id]?.sc||0).filter(s=>s>0);
const aavg=sc.length?(sc.reduce((x,y)=>x+y,0)/sc.length).toFixed(1):0;
const pct=aavg?parseFloat(aavg)/5*100:0;
bars+=`<div class="bar-row"><div class="bar-label">${a.emoji} ${a.name.split('(')[0]}</div><div class="bar-wrap"><div class="bar-fill" style="width:${pct}%;background:${a.color}">${aavg||''}</div></div><div class="bar-count">${sc.length}/${a.count}</div></div>`;
});
return `<div class="stats-grid">
<div class="stat-card"><div class="stat-value blue">${avg}</div><div class="stat-label">평균 점수</div></div>
<div class="stat-card"><div class="stat-value green">${done}</div><div class="stat-label">완료 / 222</div></div>
<div class="stat-card"><div class="stat-value orange">${low}</div><div class="stat-label">미흡 (≤2점)</div></div>
</div><div class="chart-card"><div class="chart-title">📊 영역별 현황</div>${bars}</div>`;
}

function renderAdmin(){
if(!cfg.users[user]?.admin)return '<p>관리자 권한이 필요합니다.</p>';
const list=Object.keys(cfg.users).map(n=>{
const d=cfg.users[n].data||{};
const done=ITEMS.filter(i=>d[i.id]?.sc>0).length;
return `<div class="eval-item"><div><span class="eval-name">${n}</span>${cfg.users[n].admin?' 👑':''}</div><div class="eval-info">${done}/222 완료 <button class="btn btn-red" style="width:auto;padding:6px 12px;margin-left:8px" onclick="delUser('${n}')">삭제</button></div></div>`;
}).join('');
return `<div class="admin-card"><h3>➕ 평가자 등록</h3>
<div class="form-row"><input id="newName" placeholder="이름"><input id="newPw" placeholder="비밀번호" type="password"><button class="btn btn-blue" style="width:auto" onclick="addUser()">등록</button></div></div>
<div class="admin-card"><h3>👥 평가자 목록 (${Object.keys(cfg.users).length}명)</h3><div class="eval-list">${list||'등록된 평가자가 없습니다'}</div></div>
<div class="admin-card"><h3>💾 데이터 관리</h3>
<button class="btn btn-green" style="width:auto;margin-right:8px" onclick="exportData()">📥 JSON 내보내기</button>
<button class="btn btn-gray" style="width:auto;margin-right:8px" onclick="document.getElementById('impFile').click()">📤 불러오기</button>
<input type="file" id="impFile" accept=".json" style="display:none" onchange="importData(event)">
<button class="btn btn-red" style="width:auto" onclick="resetData()">🗑️ 초기화</button></div>`;

function toggleItem(id){document.getElementById('card-'+id).classList.toggle('open')}
function setScore(id,sc){
if(!cfg.users[user].data)cfg.users[user].data={};
if(!cfg.users[user].data[id])cfg.users[user].data[id]={};
cfg.users[user].data[id].sc=sc;
const card=document.getElementById('card-'+id);
card.className='item-card open s'+sc;
card.querySelectorAll('.score-btn').forEach(b=>b.classList.remove('sel'));
card.querySelector('.score-btn.s'+sc).classList.add('sel');
document.getElementById('badge-'+id).textContent=sc+'점';
document.getElementById('badge-'+id).className='badge filled';
save();updProg();
}
function setMemo(id,memo){
if(!cfg.users[user].data)cfg.users[user].data={};
if(!cfg.users[user].data[id])cfg.users[user].data[id]={};
cfg.users[user].data[id].memo=memo;save();
}

function addUser(){
const name=document.getElementById('newName').value.trim(),pw=document.getElementById('newPw').value;
if(!name||!pw){alert('이름과 비밀번호를 입력하세요');return}
if(cfg.users[name]){alert('이미 존재하는 평가자');return}
cfg.users[name]={pw,admin:false,data:{}};save();
document.getElementById('newName').value='';document.getElementById('newPw').value='';
render();alert(name+' 등록 완료');
}
function delUser(name){
if(name===user){alert('자신은 삭제할 수 없습니다');return}
if(!confirm(name+' 평가자를 삭제하시겠습니까?'))return;
delete cfg.users[name];save();render();
}
function exportData(){
const blob=new Blob([JSON.stringify(cfg,null,2)],{type:'application/json'});
const a=document.createElement('a');a.href=URL.createObjectURL(blob);
a.download='PI_Backup_'+new Date().toISOString().slice(0,10)+'.json';a.click();
}
function importData(e){
const file=e.target.files[0];if(!file)return;
const reader=new FileReader();
reader.onload=ev=>{try{cfg=JSON.parse(ev.target.result);save();render();updUserList();alert('불러오기 완료')}catch(err){alert('파일 오류')}};
reader.readAsText(file);e.target.value='';
}
function resetData(){
if(!confirm('모든 데이터를 초기화하시겠습니까?'))return;
if(!confirm('정말로 삭제하시겠습니까? 복구 불가!'))return;
cfg={adminPw:'admin123',users:{}};save();logout();
}

// 초기 관리자 계정 생성
if(!cfg.users['관리자']){cfg.users['관리자']={pw:'admin123',admin:true,data:{}};save();updUserList()}
</script>
